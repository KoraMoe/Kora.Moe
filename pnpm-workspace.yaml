  "postcss@<8.5.23": "8.5.23"
  "nanoid@>=3 <3.3.18": "3.3.18"
  "@xmldom/xmldom@>=0.9 <0.9.12": "0.9.12"
  "immutable@>=5 <5.1.8": "5.1.8"
  "multer@>=2 <2.4.0": "2.4.0"
  "@fastify/busboy@<3.2.2": "3.2.2"
  "http-cache-semantics@<4.3.0": "4.3.0"
