packages:
  - packages/backend
  - packages/frontend-shared
  - packages/frontend
  - packages/frontend-builder
  - packages/frontend-embed
  - packages/i18n
  - packages/icons-subsetter
  - packages/sw
  - packages/misskey-js
  - packages/misskey-js/generator
  - packages/misskey-reversi
  - packages/misskey-bubble-game
  - packages-private/*
allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': true
  '@sentry/profiling-node': true
  '@sentry-internal/node-cpu-profiler': true
  '@sentry/node-cpu-profiler': true
  bufferutil: true
  canvas: true
  core-js: true
  esbuild: true
  msgpackr-extract: true
  msw: true
  nice-napi: true
  re2: true
  sharp: true
  utf-8-validate: true
  v-code-diff: true
  vue-demi: true
  exifreader: false
  protobufjs: false
  pnpm: true
minimumReleaseAge: 10080 # delay 7days to mitigate supply-chain attack
minimumReleaseAgeExclude:
  # Explicit toolchain upgrade; retain the default age policy for other packages.
  - pnpm@12.3.4
  - '@pnpm/exe.darwin-arm64@12.3.4'
  - '@pnpm/exe.darwin-x64@12.3.4'
  - '@pnpm/exe.linux-arm64@12.3.4'
  - '@pnpm/exe.linux-arm64-musl@12.3.4'
  - '@pnpm/exe.linux-x64@12.3.4'
  - '@pnpm/exe.linux-x64-musl@12.3.4'
  - '@pnpm/exe.win32-arm64@12.3.4'
  - '@pnpm/exe.win32-x64@12.3.4'
  - '@misskey-dev/*'
  - '@syuilo/aiscript'
  - buraha
  - mfm-js
  - slacc
  - slacc-android-arm-eabi
  - slacc-android-arm64
  - slacc-darwin-arm64
  - slacc-darwin-universal
  - slacc-darwin-x64
  - slacc-freebsd-x64
  - slacc-linux-arm-gnueabihf
  - slacc-linux-arm64-gnu
  - slacc-linux-arm64-musl
  - slacc-linux-x64-gnu
  - slacc-linux-x64-musl
  - slacc-win32-arm64-msvc
  - slacc-win32-x64-msvc
  - '@typescript/native-preview*'
  - undici@6.28.1 || 7.29.1 # そのうち消す
  # Renovate security update: nodemailer@9.1.1
  - nodemailer@9.1.1
  # Renovate security update: fastify@5.12.5
  - fastify@5.12.5
  # Verified security patches may bypass the normal release-age delay.
  - "ip-address@10.7.4"
  - "uuid@11.1.1"
  - "qs@6.16.0"
  - "brace-expansion@1.1.21"
  - "brace-expansion@2.1.7"
  - "brace-expansion@5.0.12"
  - "body-parser@2.3.0"
  - "fast-uri@3.1.8"
  - "fast-uri@4.1.5"
  - "find-my-way@9.7.0"
  - "postcss@8.5.23"
  - "nanoid@3.3.18"
  - "@xmldom/xmldom@0.9.12"
  - "immutable@5.1.8"
  - "multer@2.4.0"
  - "@fastify/busboy@3.2.2"
  - "http-cache-semantics@4.3.0"
  - "katex@0.19.0"
  - "source-map-js@1.2.2"
  - "proxy-addr@2.0.8"
  - "postcss-selector-parser@7.1.6"
  - "vite@8.2.4"
  - "fastify@5.12.6"
  - "nodemailer@10.0.10"
  - "sharp@0.35.5"
  - "sanitize-html@2.18.1"
overrides:
  '@aiscript-dev/aiscript-languageserver': '-'
  chokidar: 5.0.0
  lodash: 4.18.1
  undici@^7: 7.29.1
  undici@^6: 6.28.1
  '@tabler/icons-webfont>sharp': '-'
  "ip-address": "10.7.4"
  "uuid@<11.1.1": "11.1.1"
  "qs@<6.16.0": "6.16.0"
  "brace-expansion@<2": "1.1.21"
  "brace-expansion@>=2 <3": "2.1.7"
  "brace-expansion@>=4 <6": "5.0.12"
  "body-parser@>=2 <2.3.0": "2.3.0"
  "fast-uri@>=3 <4": "3.1.8"
  "fast-uri@>=4 <5": "4.1.5"
